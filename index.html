  function updateHeroText() {
    const offset = window.scrollY * 0.35;
    heroText.style.transform = "translate(-50%, calc(-50% + " + offset + "px))";
  }

  window.addEventListener("scroll", updateHeroText, { passive: true });
  updateHeroText();
</script>
